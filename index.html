<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talent Uplift Bootcamp 2026 – Live Agenda</title>
  <style>
    :root {
      --navy: #062a63;
      --deep-teal: #0b3a48;
      --orange: #f26322;
      --soft-orange: #fff3ea;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --now: #dff7ea;
      --now-border: #18a058;
      --next: #fff4d9;
      --next-border: #f3a712;
      --completed: #eef1f5;
      --break: #edf0f2;
      --break-border: #98a2b3;
      --danger: #b42318;
      --shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(242, 99, 34, 0.12), transparent 30rem),
        radial-gradient(circle at 92% 0%, rgba(6, 42, 99, 0.14), transparent 32rem),
        linear-gradient(180deg, #fffaf4 0%, var(--bg) 52%, #ffffff 100%);
      color: var(--text);
    }

    header {
      padding: 16px 0 10px;
      position: relative;
      z-index: 1;
    }

    .agenda-hero {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      padding: 22px 24px;
      color: #ffffff;
      background:
        linear-gradient(135deg, rgba(6, 42, 99, 0.98), rgba(11, 58, 72, 0.93) 58%, rgba(242, 99, 34, 0.96)),
        linear-gradient(90deg, var(--navy), var(--orange));
      box-shadow: 0 20px 48px rgba(6, 42, 99, 0.18);
    }

    .agenda-hero::before {
      content: "";
      position: absolute;
      right: -110px;
      bottom: -150px;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      border: 38px solid rgba(255, 255, 255, 0.08);
      transform: rotate(-18deg);
      pointer-events: none;
    }

    .agenda-hero::after {
      content: "";
      position: absolute;
      left: -70px;
      bottom: -90px;
      width: 260px;
      height: 150px;
      opacity: 0.13;
      background:
        linear-gradient(135deg, transparent 48%, #ffffff 49% 51%, transparent 52%),
        linear-gradient(45deg, transparent 48%, #ffffff 49% 51%, transparent 52%);
      background-size: 54px 54px;
      pointer-events: none;
    }

    .agenda-hero-content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
    }

    .mini-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 9px 14px;
      background: linear-gradient(135deg, rgba(6, 42, 99, 0.96), rgba(11, 58, 72, 0.94) 62%, rgba(242, 99, 34, 0.92));
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 22px rgba(16, 24, 40, 0.16);
      backdrop-filter: blur(10px);
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.24s ease, opacity 0.24s ease;
    }

    .mini-header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 0;
    }

    body.compact-header .mini-header {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .mini-logo {
      width: 38px;
      height: 30px;
      object-fit: contain;
      flex: 0 0 auto;
      display: none;
    }

    .mini-title {
      color: #ffffff;
      font-weight: 850;
      font-size: clamp(14px, 2.4vw, 19px);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .mini-time-pill {
      display: none;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      min-width: 0;
    }

    .logo-shell {
      width: 78px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      border-radius: 0;
    }

    .logo-shell img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
    }

    .logo-placeholder {
      color: #ffffff;
      font-weight: 950;
      letter-spacing: 0.04em;
      font-size: 18px;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
    }

    .brand-kicker {
      display: block;
      margin: 0 0 5px;
      color: #ffd7bf;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 13px;
      font-size: clamp(28px, 4.4vw, 48px);
      line-height: 0.96;
      color: #ffffff;
      letter-spacing: -0.045em;
      font-weight: 950;
      transition: font-size 0.22s ease, margin 0.22s ease;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.84);
      font-size: 14px;
      line-height: 1.45;
      margin: 0;
      transition: opacity 0.22s ease, max-height 0.22s ease, transform 0.22s ease;
      max-height: none;
    }

    .topbar {
      display: grid;
      gap: 9px;
      align-items: stretch;
      justify-content: end;
      min-width: 260px;
      transition: opacity 0.22s ease, max-height 0.22s ease, transform 0.22s ease, margin 0.22s ease;
    }

    .status-pill, .legend-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .legend {
      max-width: 1180px;
      margin: 10px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .dot-now { background: var(--now-border); }
    .dot-next { background: var(--next-border); }
    .dot-completed { background: #98a2b3; }
    .dot-break { background: #cfd4dc; }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 50px;
      padding: 0;
    }

    .footer-admin-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto 24px;
      padding: 0;
    }

    .footer-admin-trigger {
      width: 100%;
      min-height: 46px;
      border: 0;
      background: transparent;
      border-radius: 0;
      cursor: default;
    }

    .footer-admin-trigger:hover {
      border-color: transparent;
      background: transparent;
    }

    .footer-admin-shell.open .footer-admin-trigger {
      min-height: 6px;
      pointer-events: none;
    }

    .organizer-login {
      display: none;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 0 8px;
      border: 0;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      position: static;
      transform: none;
      margin-top: 0;
    }

    .footer-admin-shell.open .organizer-login { display: flex; }

    input, textarea, button, select {
      font: inherit;
    }

    input, textarea, select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #ffffff;
      color: var(--text);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--navy);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:hover { transform: translateY(-1px); }
    button.secondary { background: #eef2f6; color: #25324b; }
    button.orange { background: var(--orange); }
    button.danger { background: var(--danger); }
    button.small { padding: 7px 10px; font-size: 12px; border-radius: 8px; }

    .admin-panel {
      display: none;
      margin: 14px auto 0;
      padding: 18px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .admin-panel.open { display: block; }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .admin-section {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcfe;
    }

    .admin-section h3 {
      margin: 0 0 10px;
      color: var(--navy);
      font-size: 16px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 6px 0 12px;
    }

    .csv-box {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .agenda-day {
      margin-bottom: 28px;
      background: #ffffff;
      border-radius: var(--radius);
      box-shadow: var(--shadow), 0 0 0 1px rgba(217, 222, 232, 0.88);
      overflow: hidden;
      border: 0;
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background:
        linear-gradient(135deg, rgba(6, 42, 99, 0.98), rgba(11, 58, 72, 0.96) 62%, rgba(242, 99, 34, 0.92));
      color: #ffffff;
      padding: 16px 18px;
      min-height: 64px;
    }

    .day-title {
      margin: 0;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
    }

    .day-date {
      opacity: 0.95;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .agenda-day table {
      width: calc(100% + 1px);
      margin-right: -1px;
    }

    th, td {
      border-top: 1px solid var(--line);
      padding: 12px 10px;
      vertical-align: middle;
      line-height: 1.35;
    }

    thead {
      background:
        linear-gradient(135deg, rgba(6, 42, 99, 0.98), rgba(11, 58, 72, 0.96) 62%, rgba(242, 99, 34, 0.9));
    }

    th {
      background: transparent;
      color: #ffffff;
      font-size: 14px;
      text-align: center;
    }

    .agenda-day thead th:last-child {
      box-shadow: 2px 0 0 rgba(242, 99, 34, 0.9);
    }

    td.time, td.duration, td.pic { text-align: center; }
    td.session { font-weight: 700; }
    .capability { color: var(--orange); }
    .muted { color: var(--muted); }

    tr.is-break td {
      background: var(--break);
      font-style: italic;
    }

    tr.is-completed td {
      background: var(--completed);
      color: #667085;
    }

    tr.is-next td {
      background: var(--next);
      border-top: 2px solid var(--next-border);
      border-bottom: 2px solid var(--next-border);
    }

    tr.is-now td {
      background: var(--now);
      border-top: 2px solid var(--now-border);
      border-bottom: 2px solid var(--now-border);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 8px;
      margin-left: 8px;
      white-space: nowrap;
    }

    .badge.now { color: #067647; background: #abefc6; }
    .badge.next { color: #93370d; background: #fedf89; }
    .badge.break { color: #475467; background: #d0d5dd; }

    .mobile-days { display: none; }

    .card-list {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .session-card {
      border: 1px solid var(--line);
      border-left: 5px solid transparent;
      border-radius: 15px;
      padding: 14px;
      background: #ffffff;
    }

    .session-card.is-break { background: var(--break); border-left-color: var(--break-border); }
    .session-card.is-completed { background: var(--completed); color: #667085; }
    .session-card.is-next { background: var(--next); border-left-color: var(--next-border); }
    .session-card.is-now { background: var(--now); border-left-color: var(--now-border); }

    .card-time {
      font-weight: 800;
      color: var(--navy);
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-title {
      font-weight: 800;
      font-size: 16px;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .card-pic {
      color: var(--muted);
      font-size: 13px;
    }

    .editor-table-wrapper {
      overflow-x: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-top: 16px;
      background: #ffffff;
    }

    .editor-table {
      width: 100%;
      min-width: 0;
      table-layout: fixed;
      font-size: 13px;
    }

    .editor-table th { background: #eef2f6; color: #25324b; padding: 9px 5px; }
    .editor-table td { padding: 6px 5px; }
    .editor-table input { width: 100%; padding: 7px 8px; border-radius: 8px; min-width: 0; }
    .editor-table input[data-field="session"], .editor-table input[data-field="pic"] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .editor-table .duration-cell { text-align: center; font-weight: 700; color: var(--navy); }
    .time-control { display: block; }
    .time-control input[data-field="start_time"], .time-control input[data-field="end_time"] { text-align: center; font-variant-numeric: tabular-nums; }
    .drag-cell { text-align: center; color: var(--muted); user-select: none; }
    .drag-handle { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 32px; border-radius: 8px; cursor: grab; font-weight: 900; }
    .drag-handle:active { cursor: grabbing; background: #eef2f6; }
    tr.dragging { opacity: 0.45; }
    tr.drag-over td { box-shadow: inset 0 2px 0 var(--orange); }
    .file-input {
      width: 100%;
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #ffffff;
      margin-bottom: 10px;
    }

    .color-guide {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .color-guide-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #ffffff;
      font-size: 13px;
      line-height: 1.42;
    }

    .color-guide-item strong {
      color: var(--navy);
    }

    .empty-state {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      background: #ffffff;
      border-radius: var(--radius);
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 28px 0 0;
    }


    .mobile-table-wrap {
      overflow: hidden;
    }

    .mobile-agenda-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    .mobile-agenda-table th,
    .mobile-agenda-table td {
      padding: 9px 6px;
      line-height: 1.28;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .mobile-agenda-table th {
      font-size: 11px;
      background: transparent;
      color: #ffffff;
      text-align: center;
    }

    .mobile-agenda-table td.time,
    .mobile-agenda-table td.duration,
    .mobile-agenda-table td.pic {
      text-align: center;
    }

    .mobile-agenda-table td.session {
      font-weight: 800;
      text-align: left;
    }

    .mobile-agenda-table .badge {
      margin-left: 4px;
      margin-top: 3px;
      padding: 3px 6px;
      font-size: 9px;
      letter-spacing: 0.02em;
    }


    @media (max-width: 820px) {
      header { padding: 10px 0 6px; }
      .agenda-hero, main, .footer-admin-shell { width: min(100% - 24px, 1180px); }
      .agenda-hero { padding: 16px; border-radius: 22px; }
      .agenda-hero-content { grid-template-columns: 1fr; gap: 14px; }
      .agenda-hero::before { width: 240px; height: 240px; right: -120px; bottom: -150px; border-width: 30px; }
      .agenda-hero::after { opacity: 0.09; }
      .brand-row { gap: 10px; align-items: center; }
      .logo-shell { width: 64px; height: 58px; border-radius: 0; }
      h1 { font-size: clamp(28px, 9vw, 36px); }
      .brand-kicker { font-size: 9px; letter-spacing: 0.12em; margin-bottom: 4px; }
      .subtitle { font-size: 12px; }
      .legend-item { font-size: 11px; padding: 5px 8px; }
      .desktop-days { display: none; }
      .mobile-days { display: block; }
      .day-header { padding: 14px; }
      .day-title { font-size: 18px; }
      .day-date { font-size: 13px; }
      .mobile-agenda-table { font-size: 11px; }
      .mobile-agenda-table th, .mobile-agenda-table td { padding: 8px 5px; }
      .admin-grid { grid-template-columns: 1fr; }
      .topbar { min-width: 0; width: 100%; justify-content: stretch; }
      .status-pill { width: 100%; justify-content: center; padding: 7px 10px; }
      .mini-header-inner { justify-content: flex-start; gap: 8px; }
      .mini-logo { width: 32px; height: 26px; }
      main { margin-top: 16px; }
    }
  </style>
</head>

      { day: "DAY 2", date: "2026-07-16", start_time: "11:00", end_time: "11:30", session: "Integration Activity: 4 Capability Stations Mind map", pic: "MC / AHR" },
      { day: "DAY 2", date: "2026-07-16", start_time: "11:30", end_time: "12:30", session: "Lunch Break", pic: "" },
      { day: "DAY 2", date: "2026-07-16", start_time: "12:30", end_time: "12:40", session: "Energizer: Reset & Refocus", pic: "MC / AHR" },
      { day: "DAY 2", date: "2026-07-16", start_time: "12:40", end_time: "13:40", session: "Leadership Journey Mapping: From Potential to Readiness", pic: "Minh / Rose" },
      { day: "DAY 2", date: "2026-07-16", start_time: "13:40", end_time: "14:10", session: "Business Case Briefing", pic: "Case Providers – TBC" },
      { day: "DAY 2", date: "2026-07-16", start_time: "14:10", end_time: "14:40", session: "Case-Solving Mini workshop: Problem Solving & Business Recommendation", pic: "MC / AHR" },
      { day: "DAY 2", date: "2026-07-16", start_time: "14:40", end_time: "16:40", session: "Business Case Challenge - Team Discussion", pic: "Mentor & Group Observation: Thao VC, Cong VC, Doan" },

      { day: "DAY 3", date: "2026-07-17", start_time: "08:30", end_time: "09:20", session: "Team Finalization: Executive Presentation Preparation", pic: "" },
      { day: "DAY 3", date: "2026-07-17", start_time: "09:20", end_time: "09:30", session: "Showcase Setup & Final Submission", pic: "MC / AHR" },
      { day: "DAY 3", date: "2026-07-17", start_time: "09:30", end_time: "09:55", session: "Business Case Showcase & Panel Feedback – Team 1", pic: "Panel: Aaron, Gabriel, Minh, Rose, Jane" },
      { day: "DAY 3", date: "2026-07-17", start_time: "09:55", end_time: "10:20", session: "Business Case Showcase & Panel Feedback – Team 2", pic: "Panel: Aaron, Gabriel, Minh, Rose, Jane" },
      { day: "DAY 3", date: "2026-07-17", start_time: "10:20", end_time: "10:45", session: "Business Case Showcase & Panel Feedback – Team 3", pic: "Panel: Aaron, Gabriel, Minh, Rose, Jane" },
      { day: "DAY 3", date: "2026-07-17", start_time: "10:45", end_time: "10:55", session: "Short Break", pic: "" },
      { day: "DAY 3", date: "2026-07-17", start_time: "10:55", end_time: "11:20", session: "Appreciation & Recognition", pic: "Aaron, Gabriel, Minh, Rose, Jane\nMC / AHR" },
      { day: "DAY 3", date: "2026-07-17", start_time: "11:20", end_time: "11:30", session: "Closing + 30-Day Commitment Challenge", pic: "Aaron + AHR" }
    ];

    let agenda = [...sampleAgenda];
    let adminUnlocked = false;
    let testNow = null;
    let realtimeDbReady = false;
    let db = null;
    let agendaRef = null;
    let setDbFn = null;
    const BOOTCAMP_LOGO_URL = "assets/bootcamp-logo.png";
    let logoUrl = BOOTCAMP_LOGO_URL;
    let dragStartIndex = null;
    let editorHistory = [];
    let editorHistoryIndex = -1;
    let isRestoringHistory = false;

    const el = (id) => document.getElementById(id);

    function isFirebaseConfigured() {
      return (
        firebaseConfig.apiKey &&
        !firebaseConfig.apiKey.includes("PASTE_YOUR") &&
        firebaseConfig.databaseURL &&
        !firebaseConfig.databaseURL.includes("PASTE_YOUR")
      );
    }

    async function initFirebase() {
      if (!isFirebaseConfigured()) {
        console.info("Firebase Realtime Database is not configured yet. Using sample/local agenda.");
        return;
      }

      try {
        const firebaseApp = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
        const firebaseDb = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js");

        const app = firebaseApp.initializeApp(firebaseConfig);
        db = firebaseDb.getDatabase(app);
        agendaRef = firebaseDb.ref(db, REALTIME_DB_PATH);
        setDbFn = firebaseDb.set;
        realtimeDbReady = true;

        firebaseDb.onValue(agendaRef, (snapshot) => {
          const data = snapshot.val();
          if (data && Array.isArray(data.items)) {
            agenda = normalizeAgenda(data.items);
            logoUrl = BOOTCAMP_LOGO_URL;
            applyLogo();
            renderAll();
          } else {
            agenda = normalizeAgenda(sampleAgenda);
            renderAll();
          }
        }, (error) => {
          console.error("Realtime Database listener error:", error);
          realtimeDbReady = false;
        });
      } catch (error) {
        console.error("Firebase Realtime Database could not be loaded. The agenda will still work with local sample/editor data.", error);
        realtimeDbReady = false;
      }
    }

    function normalizeAgenda(items) {
      const normalized = items
        .filter(item => item && item.date && item.start_time && item.end_time && item.session)
        .map(item => {
          const normalizedDate = normalizeDate(item.date);
          return {
            day: String(item.day || "").trim() || deriveDayLabel(normalizedDate),
            date: normalizedDate,
            start_time: toHHMM(item.start_time),
            end_time: toHHMM(item.end_time),
            session: cleanSingleLine(item.session),
            pic: cleanSingleLine(item.pic)
          };
        });
      return fixAmbiguousExcelTimes(normalized);
    }

    function timeToMinutes(value) {
      const match = String(value || "").match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return NaN;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function minutesToHHMM(minutes) {
      const safe = ((minutes % 1440) + 1440) % 1440;
      const hour = Math.floor(safe / 60);
      const minute = safe % 60;
      return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function fixAmbiguousExcelTimes(items) {
      let currentGroup = "";
      let previousEnd = null;

      return items.map(item => {
        const groupKey = `${item.date}|${item.day}`;
        if (groupKey !== currentGroup) {
          currentGroup = groupKey;
          previousEnd = null;
        }

        let start = timeToMinutes(item.start_time);
        let end = timeToMinutes(item.end_time);

        if (Number.isFinite(start) && Number.isFinite(end)) {
          // Excel sometimes turns 14:40 into 2:40 when a downloaded CSV is edited and saved again.
          // If a time suddenly jumps backwards within the same agenda day, treat it as afternoon time.
          while (previousEnd !== null && start < previousEnd - 5 && start < 12 * 60) {
            start += 12 * 60;
            end += 12 * 60;
          }
          while (end <= start && end < 12 * 60) {
            end += 12 * 60;
          }

          item.start_time = minutesToHHMM(start);
          item.end_time = minutesToHHMM(end);
          previousEnd = end;
        }

        return item;
      });
    }

    function cleanSingleLine(value) {
      return String(value || "").replace(/\s*\r?\n\s*/g, " / ").replace(/\s+/g, " ").trim();
    }

    function normalizeDate(value) {
      const text = String(value || "").trim().replace(/^="(.*)"$/, "$1").replace(/^'(.*)$/, "$1");
      if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(text)) {
        const [y, m, d] = text.split("-");
        return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
      }

      const slash = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (slash) {
        let a = Number(slash[1]);
        let b = Number(slash[2]);
        let y = slash[3].length === 2 ? Number(`20${slash[3]}`) : Number(slash[3]);
        // Excel usually exports dates as M/D/YYYY for this file, e.g. 7/15/2026.
        let month = a;
        let day = b;
        if (a > 12 && b <= 12) {
          day = a;
          month = b;
        }
        return `${String(y).padStart(4, "0")}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      const parsed = new Date(text);
      if (!Number.isNaN(parsed.getTime())) {
        return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}-${String(parsed.getDate()).padStart(2, "0")}`;
      }

      return text;
    }

    function deriveDayLabel(dateString) {
      const uniqueDates = [...new Set(sampleAgenda.map(x => x.date))];
      const idx = uniqueDates.indexOf(dateString);
      return idx >= 0 ? `DAY ${idx + 1}` : "DAY";
    }

    function toHHMM(value) {
      const text = String(value || "").trim().replace(/^="(.*)"$/, "$1").replace(/^'(.*)$/, "$1");
      const ampm = text.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)$/i);
      if (ampm) {
        let hour = Number(ampm[1]);
        const minute = ampm[2];
        const period = ampm[3].toUpperCase();
        if (period === "PM" && hour < 12) hour += 12;
        if (period === "AM" && hour === 12) hour = 0;
        return `${String(hour).padStart(2, "0")}:${minute}`;
      }

      const match = text.match(/^(\d{1,2}):(\d{2})(?::\d{2})?/);
      if (!match) return text;
      return `${match[1].padStart(2, "0")}:${match[2]}`;
    }

    function startDate(item) {
      return new Date(`${item.date}T${item.start_time}:00`);
    }

    function endDate(item) {
      return new Date(`${item.date}T${item.end_time}:00`);
    }

    function durationMinutes(item) {
      const minutes = Math.round((endDate(item) - startDate(item)) / 60000);
      return Number.isFinite(minutes) ? minutes : 0;
    }

    function displayDate(dateString) {
      const date = new Date(`${dateString}T00:00:00`);
      if (Number.isNaN(date.getTime())) return dateString;
      return date.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
    }

    function formatNow(date) {
      return date.toLocaleString("en-GB", {
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function isBreak(item) {
      return /break|lunch|networking/i.test(item.session || "");
    }

    function isCapability(item) {
      return /capability station|business case showcase|leadership journey mapping|leadership journey experience|business case briefing/i.test(item.session || "");
    }

    function getNow() {
      return testNow ? new Date(testNow) : new Date();
    }

    function getStateMap(now) {
      const stateMap = new Map();
      const sorted = [...agenda].sort((a, b) => startDate(a) - startDate(b));
      const current = sorted.find(item => now >= startDate(item) && now < endDate(item));
      const upcoming = sorted.find(item => startDate(item) > now);

      sorted.forEach(item => {
        const key = itemKey(item);
        if (current && itemKey(current) === key) stateMap.set(key, "now");
        else if (upcoming && itemKey(upcoming) === key) stateMap.set(key, "next");
        else if (endDate(item) <= now) stateMap.set(key, "completed");
        else stateMap.set(key, "future");
      });

      return stateMap;
    }

    function itemKey(item) {
      return `${item.date}|${item.start_time}|${item.end_time}|${item.session}`;
    }

    function rowClasses(item, state) {
      const classes = [];
      if (isBreak(item)) classes.push("is-break");
      if (state === "completed") classes.push("is-completed");
      if (state === "next") classes.push("is-next");
      if (state === "now") classes.push("is-now");
      return classes.join(" ");
    }

    function badges(item, state) {
      let output = "";
      if (state === "now") output += `<span class="badge now">Now</span>`;
      if (state === "next") output += `<span class="badge next">Up Next</span>`;
      if (isBreak(item)) output += `<span class="badge break">Break</span>`;
      return output;
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
        .replaceAll("\n", "<br>");
    }

    function escapeAttr(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function applyLogo() {
      const img = el("bootcampLogo");
      const placeholder = el("logoPlaceholder");
      if (logoUrl) {
        img.src = logoUrl;
        img.style.display = "block";
        placeholder.style.display = "none";
      } else {
        img.removeAttribute("src");
        img.style.display = "none";
        placeholder.style.display = "inline";
      }
    }

    function groupByDate(items) {
      const groups = new Map();
      items.forEach(item => {
        if (!groups.has(item.date)) groups.set(item.date, []);
        groups.get(item.date).push(item);
      });
      return [...groups.entries()].map(([date, rows]) => ({ date, rows }));
    }

    function renderAll() {
      const now = getNow();
      const timeText = `${testNow ? "Test time" : "Current time"}: ${formatNow(now)}`;
      el("currentTimeLabel").textContent = timeText;
      el("miniTimeLabel").textContent = timeText;
      renderAgenda();
    }

    function renderAgenda() {
      const root = el("agendaRoot");
      const now = getNow();
      const stateMap = getStateMap(now);
      const groups = groupByDate(agenda);

      if (!groups.length) {
        root.innerHTML = `<div class="empty-state">No agenda data available.</div>`;
        return;
      }

      const desktop = groups.map(({ date, rows }) => {
        const day = rows[0]?.day || "DAY";
        const body = rows.map(item => {
          const state = stateMap.get(itemKey(item));
          return `
            <tr class="${rowClasses(item, state)}">
              <td class="time">${escapeHtml(item.start_time)} - ${escapeHtml(item.end_time)}</td>
              <td class="duration">${durationMinutes(item)}</td>
              <td class="session ${isCapability(item) ? "capability" : ""}">${escapeHtml(item.session)} ${badges(item, state)}</td>
              <td class="pic">${escapeHtml(item.pic)}</td>
            </tr>
          `;
        }).join("");

        return `
          <article class="agenda-day">
            <div class="day-header">
              <h2 class="day-title">${escapeHtml(day)}</h2>
              <span class="day-date">${displayDate(date)}</span>
            </div>
            <div class="desktop-days">
              <table>
                <thead>
                  <tr>
                    <th style="width:18%;">Time</th>
                    <th style="width:12%;">Duration<br>(min)</th>
                    <th style="width:43%;">Session Name</th>
                    <th style="width:27%;">Lead / Facilitator</th>
                  </tr>
                </thead>
                <tbody>${body}</tbody>
              </table>
            </div>
          </article>
        `;
      }).join("");

      const mobile = groups.map(({ date, rows }) => {
        const day = rows[0]?.day || "DAY";
        const body = rows.map(item => {
          const state = stateMap.get(itemKey(item));
          return `
            <tr class="${rowClasses(item, state)}">
              <td class="time">${escapeHtml(item.start_time)}<br>${escapeHtml(item.end_time)}</td>
              <td class="duration">${durationMinutes(item)}</td>
              <td class="session ${isCapability(item) ? "capability" : ""}">${escapeHtml(item.session)} ${badges(item, state)}</td>
              <td class="pic">${escapeHtml(item.pic || "")}</td>
            </tr>
          `;
        }).join("");

        return `
          <article class="agenda-day mobile-days">
            <div class="day-header">
              <h2 class="day-title">${escapeHtml(day)}</h2>
              <span class="day-date">${displayDate(date)}</span>
            </div>
            <div class="mobile-table-wrap">
              <table class="mobile-agenda-table">
                <thead>
                  <tr>
                    <th style="width:20%;">Time</th>
                    <th style="width:12%;">Min</th>
                    <th style="width:44%;">Session</th>
                    <th style="width:24%;">Lead</th>
                  </tr>
                </thead>
                <tbody>${body}</tbody>
              </table>
            </div>
          </article>
        `;
      }).join("");

      root.innerHTML = `<div class="desktop-days">${desktop}</div>${mobile}`;
    }

    let scrollTicking = false;
    window.addEventListener("scroll", () => {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(() => {
        const shouldCompact = window.scrollY > 140;
        document.body.classList.toggle("compact-header", shouldCompact);
        scrollTicking = false;
      });
    }, { passive: true });

    agenda = normalizeAgenda(sampleAgenda);
    applyLogo();
    renderAll();
    initFirebase();
    setInterval(renderAll, 30000);
  </script>
